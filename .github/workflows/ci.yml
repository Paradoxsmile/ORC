name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify git identity for worktree tests
        run: |
          git config --global user.name "ORC CI"
          git config --global user.email "ci@orc.local"

      - name: Syntax, required files, and privacy check
        run: node scripts/check.mjs

      - name: Run unit tests
        run: node --test

      - name: Run end-to-end smoke test
        run: node scripts/smoke.mjs
